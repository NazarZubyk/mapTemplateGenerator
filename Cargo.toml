[package]
name = "mapTemplateGenerator"
version = "0.1.0"
edition = "2024"
# `cargo run` starts the app; the MCP server is `--bin mapgen-mcp`.
default-run = "mapTemplateGenerator"

[lib]
name = "map_template_generator"
path = "src/lib.rs"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
# Fast iteration: minimal debuginfo keeps incremental rebuilds and linking quick.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies are compiled once; a bit of optimization keeps the debug UI responsive.
[profile.dev.package."*"]
opt-level = 1
